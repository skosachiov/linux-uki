name: Build Debian Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        debian-version: [trixie, forky]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Build
      uses: docker/setup-buildx-action@v3

    - name: Build in Docker and preserve artifacts
      run: |
        mkdir -p artifacts

    - name: Build Debian Package in Container
      run: |
        docker run \
          --rm \
          -v $(pwd):/workspace \
          -v $(pwd)/artifacts:/artifacts \
          -w /workspace \
          -e PCR_PRIVATE_KEY_INITRD="${{ secrets.PCR_PRIVATE_KEY_INITRD }}" \
          -e PCR_PUBLIC_KEY_INITRD="${{ secrets.PCR_PUBLIC_KEY_INITRD }}" \
          debian:${{ matrix.debian-version }} \
          sh -c "
            apt-get update &&
            apt-get install -y build-essential devscripts debhelper systemd-ukify linux-headers-amd64 python3-requests-file &&
            dpkg-buildpackage -us -uc -b &&
            cp ../*.deb ../*.changes ../*.buildinfo /artifacts/
          "

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: deb-packages-${{ matrix.debian-version }}
        path: artifacts/
        if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Create Release and Upload Packages
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/**/*.deb
          artifacts/**/*.changes
          artifacts/**/*.buildinfo
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        generate_release_notes: false
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
